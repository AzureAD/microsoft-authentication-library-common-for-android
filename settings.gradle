pluginManagement {
    repositories {
        // If you don't have access to the package feed uncomment these repositories
        //  mavenCentral()
        mavenLocal()
        google()
        gradlePluginPortal()
        maven {
            name "vsts-maven-adal-android"
            url "https://identitydivision.pkgs.visualstudio.com/_packaging/NewAndroid/maven/v1"
            credentials {
                username System.getenv("ENV_VSTS_MVN_CRED_USERNAME") != null ? System.getenv("ENV_VSTS_MVN_CRED_USERNAME") : project.findProperty("vstsUsername")
                password System.getenv("ENV_VSTS_MVN_CRED_ACCESSTOKEN") != null ? System.getenv("ENV_VSTS_MVN_CRED_ACCESSTOKEN") : project.findProperty("vstsMavenAccessToken")
            }
        }
    }
}

rootProject.name = "com.microsoft.identity"

// Android Projects
include(':common')
project(':common').projectDir = new File('common')

include(':testutils')
project(':testutils').projectDir = new File('testutils')

include(':uiautomationutilities')
project(':uiautomationutilities').projectDir = new File('uiautomationutilities')

// Pure Java Projects
include(':common4j')
project(':common4j').projectDir = new File('common4j')

include(':keyvault')
project(':keyvault').projectDir = new File('keyvault')

include(':labapi')
project(':labapi').projectDir = new File('labapi')

include(':LabApiUtilities')
project(':LabApiUtilities').projectDir = new File('LabApiUtilities')
