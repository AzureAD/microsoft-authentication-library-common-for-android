# NOTE (INERT WRAPPER — read before touching): this directory has NO gradlew/gradlew.bat
# script, so common4j is NEVER built standalone through this wrapper. common4j is always
# built as a SUBPROJECT of an aggregator build — the repo root `common` (settings.gradle)
# or `common-java-root` — using THAT build's wrapper. This file is a vestigial `gradle init`
# leftover. It is kept in sync with the active wrappers (Gradle 9.3.1) for hygiene only;
# changing it has no effect on any build. The real wrappers are:
#   ../../gradle/wrapper/gradle-wrapper.properties  (repo root)
#   ../../common-java-root/gradle/wrapper/gradle-wrapper.properties
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
