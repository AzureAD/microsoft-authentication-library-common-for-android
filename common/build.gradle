plugins {
    id 'com.microsoft.identity.buildsystem' version '0.2.5'
    id 'com.android.library'
    id 'pmd'
    id 'checkstyle'
    id 'maven-publish'
    id 'kotlin-android'
    id 'jacoco'

    // Test retries
    id 'org.gradle.test-retry' version '1.5.6'
    id 'org.owasp.dependencycheck' version '12.2.2'
}

apply from: '../versioning/version_tasks.gradle'

buildSystem {
    desugar = false
}

def enableCodeCoverage = false

if (project.hasProperty("codeCoverageEnabled")) {
    enableCodeCoverage = codeCoverageEnabled.toBoolean()
}

codeCoverageReport {
    coverage.enabled = enableCodeCoverage
}

jacoco {
    toolVersion = "0.8.10"
}

// https://blog.gradle.org/gradle-flaky-test-retry-plugin
tasks.withType(Test) {
    jacoco {
        includeNoLocationClasses = true // Required for Robolectric
        excludes = ['jdk.internal.*']
    }
    retry {
        // The maximum number of test failures that are allowed before retrying is disabled.
        maxRetries = 2
        // The maximum number of times to retry an individual test.
        maxFailures = 10
        // Controls whether tests that initially fail and then pass on retry should fail the task.
        failOnPassedAfterRetry = false
    }
}

tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testLocalDebugUnitTest" // Run Robolectric tests first

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*',
            '**/Manifest*.*', '**/*Test*.*',
            'android/**/*.*', 'com/microsoft/aad/adal/**'
    ]

    def kotlinClasses = fileTree(
            dir: "$buildDir/tmp/kotlin-classes/localDebug",
            excludes: fileFilter
    )

    def javaClasses = fileTree(
            dir: "$buildDir/intermediates/javac/localDebug/compileLocalDebugJavaWithJavac/classes",
            excludes: fileFilter
    )

    sourceDirectories.setFrom(files([
            "$projectDir/src/main/java",
            "$projectDir/src/main/kotlin"
    ]))
    classDirectories.setFrom(files([kotlinClasses, javaClasses]))
    executionData.setFrom(fileTree(
            dir: buildDir,
            includes: [
                    "jacoco/testLocalDebugUnitTest.exec",
                    "outputs/unit_test_code_coverage/localDebugUnitTest/testLocalDebugUnitTest.exec"
            ]
    ))
}

// In dev, we want to keep the dependencies(common4j, broker4j, common) to 1.0.+ to be able to be consumed by daily dev pipeline.
// In release/*, we change these to specific versions being consumed.
def common4jVersion = "1.0.+"
if (project.hasProperty("distCommon4jVersion") && project.distCommon4jVersion != '') {
    common4jVersion = project.distCommon4jVersion
}

boolean newBrokerDiscoveryEnabledFlag = project.hasProperty("newBrokerDiscoveryEnabledFlag")
boolean trustDebugBrokerFlag = project.hasProperty("trustDebugBrokerFlag")
boolean bypassRedirectUriCheck = project.hasProperty("bypassRedirectUriCheck")

def robolectricRepoUsername = System.getenv("ENV_VSTS_MVN_CRED_USERNAME") != null ? System.getenv("ENV_VSTS_MVN_CRED_USERNAME") : project.findProperty("vstsUsername")
def robolectricRepoPassword = System.getenv("ENV_VSTS_MVN_CRED_ACCESSTOKEN") != null ? System.getenv("ENV_VSTS_MVN_CRED_ACCESSTOKEN") : project.findProperty("vstsMavenAccessToken")

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        namespace 'com.microsoft.identity.common'
        multiDexEnabled true
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getAppVersionCode()
        versionName getAppVersionName()
        project.archivesBaseName = "common"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //Languages Common supports.
        resConfigs "en", "ar", "b+sr+Latn", "bg", "ca", "cs", "da", "de", "el", "es", "et",
                "eu", "fi", "fr", "gl", "he", "hi", "hr", "hu", "in", "it", "iw", "ja",
                "kk", "ko", "lt", "lv", "ms", "nb", "nl", "pl", "pt-rBR", "pt-rPT", "ro",
                "ru", "sk", "sl", "sr", "sv", "th", "tr", "uk", "vi", "zh-rCN", "zh-rTW"
        buildConfigField("boolean", "newBrokerDiscoveryEnabledFlag", "$newBrokerDiscoveryEnabledFlag")
        buildConfigField("boolean", "trustDebugBrokerFlag", "$trustDebugBrokerFlag")
        buildConfigField("boolean", "bypassRedirectUriCheck", "$bypassRedirectUriCheck")
    }
    //aidl is being set to true since aidl only generated with this set
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    buildTypes {
        debug {
            testCoverageEnabled enableCodeCoverage
            minifyEnabled false
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-rules.pro'
        }
    }
    //Upgrading to Java 8 in order to use YubiKit SDK
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lintOptions {
        abortOnError true
        disable 'MissingPermission'
        disable 'LongLogTag'
        disable 'DefaultLocale'
        disable 'UnusedResources'
        disable 'GradleDependency'
        disable 'GradleOverrides'
        disable 'OldTargetApi'
        disable 'RtlHardcoded'
    }

    testOptions {
        unitTests.all {
            exclude 'com/microsoft/identity/common/integration'
            exclude 'com/microsoft/identity/common/ropc'
            if (robolectricRepoUsername?.toString()?.trim() && robolectricRepoPassword?.toString()?.trim()) {
                it.systemProperty("robolectric.dependency.repo.url", "https://identitydivision.pkgs.visualstudio.com/_packaging/NewAndroid/maven/v1")
                it.systemProperty("robolectric.dependency.repo.username", robolectricRepoUsername)
                it.systemProperty("robolectric.dependency.repo.password", robolectricRepoPassword)
            }
        }
    }

    flavorDimensions "main"

    productFlavors {
        // The 'local' productFlavor sources common4j from mavenLocal and is intended to be used
        // during development.
        local {
            dimension "main"
        }

        // The 'dist' productFlavor sources common from a central repository and is intended
        // to be used for releases.
        dist {
            dimension "main"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            aidl.srcDirs = ['src/main/aidl']

            // Also load source from common-java
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
        }
    }

    libraryVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${archivesBaseName}-${version}.aar"
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:$rootProject.ext.webkitVersion"
    testImplementation project(path: ':testutils')

    localApi(project(":common4j")) {
        transitive = false
    }

    distApi("com.microsoft.identity:common4j:${common4jVersion}") {
        transitive = false
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    androidTestImplementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$rootProject.ext.kotlinXCoroutinesVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.ext.lifecycleKtxVersion"

    implementation "androidx.datastore:datastore-preferences:$rootProject.ext.jetpackDataStoreVersion"

    implementation(group: 'com.microsoft.device.display', name: 'display-mask', version: '0.3.0')

    implementation 'org.apache.httpcomponents.core5:httpcore5:5.3'
    implementation "com.nimbusds:nimbus-jose-jwt:$rootProject.ext.nimbusVersion"
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appCompatVersion"
    implementation "com.google.code.gson:gson:$rootProject.ext.gsonVersion"
    implementation "com.squareup.moshi:moshi:$rootProject.ext.moshiVersion"
    implementation "androidx.browser:browser:$rootProject.ext.browserVersion"
    implementation "androidx.core:core:$rootProject.ext.androidxCoreVersion"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.ext.constraintLayoutVersion"
    //For Executive Order work
    implementation "com.yubico.yubikit:android:$rootProject.ext.yubikitAndroidVersion"
    implementation "com.yubico.yubikit:piv:$rootProject.ext.yubikitPivVersion"
    //For passkeys
    implementation "androidx.credentials:credentials:$rootProject.ext.AndroidCredentialsVersion"
    //needed for credentials support from play services, for devices running
    implementation "androidx.credentials:credentials-play-services-auth:$rootProject.ext.AndroidCredentialsVersion"
    implementation "com.google.android.gms:play-services-fido:$rootProject.ext.LegacyFidoApiVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$rootProject.ext.GoogleIdVersion"
    implementation "com.github.stephenc.jcip:jcip-annotations:$rootProject.ext.jcipAnnotationVersion"

    compileOnly "com.github.spotbugs:spotbugs-annotations:$rootProject.ext.spotBugsAnnotationVersion"

    compileOnly "org.projectlombok:lombok:$rootProject.ext.lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$rootProject.ext.lombokVersion"

    // Test dependencies
    // Needed to resolve JSONObject inside of non-instrumented tests
    testImplementation "org.json:json:$rootProject.ext.jsonVersion"
    testImplementation "org.skyscreamer:jsonassert:$rootProject.ext.jsonAssertVersion"
    testImplementation "junit:junit:$rootProject.ext.junitVersion"
    testImplementation "org.mockito:mockito-core:$rootProject.ext.mockitoCoreVersion"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$rootProject.ext.mockitoKotlinVersion"
    testImplementation "io.mockk:mockk:1.13.10"

    testImplementation "org.powermock:powermock-module-junit4:$rootProject.ext.powerMockVersion"
    testImplementation "org.powermock:powermock-module-junit4-rule:$rootProject.ext.powerMockVersion"
    testImplementation "org.powermock:powermock-api-mockito2:$rootProject.ext.powerMockVersion"
    testImplementation "org.powermock:powermock-classloading-xstream:$rootProject.ext.powerMockVersion"
    testImplementation "org.robolectric:robolectric:$rootProject.ext.robolectricVersion"
    testImplementation "androidx.test:core:$rootProject.ext.androidxTestCoreVersion"
    testImplementation project(":LabApiUtilities")

    testImplementation(testFixtures(project(":common4j")))
    testImplementation "androidx.lifecycle:lifecycle-runtime-testing:$rootProject.ext.lifecycleKtxVersion"

    testCompileOnly "org.projectlombok:lombok:$rootProject.ext.lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$rootProject.ext.lombokVersion"

    // Instrumented dependencies
    androidTestImplementation "androidx.test.ext:junit:$rootProject.ext.androidxJunitVersion"
    androidTestImplementation "org.mockito:mockito-android:$rootProject.ext.mockitoAndroidVersion"
    androidTestImplementation("androidx.test.espresso:espresso-core:$rootProject.ext.espressoCoreVersion", {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation "io.opentelemetry:opentelemetry-api:$rootProject.ext.openTelemetryVersion"
    implementation("io.opentelemetry:opentelemetry-extension-kotlin:$rootProject.ext.openTelemetryExtensionKotlinVersion")
    implementation "androidx.fragment:fragment:1.3.2"
}

// Create tasks to generate javadoc
android.libraryVariants.all { variant ->
    task("${variant.name}Javadoc", type: Javadoc, dependsOn: "assemble${variant.name.capitalize()}") {
        source = variant.javaCompileProvider.get().source

        title = "Microsoft Identity Android Common"

        // First add all of your dependencies to the classpath, then add the android jars
        doFirst { classpath += files(variant.javaCompiler.classpath.files) }
        classpath += files(android.getBootClasspath())

        options.memberLevel = JavadocMemberLevel.PUBLIC
        options.addBooleanOption('Xdoclint:none', true)

        // We're excluding these generated files
        exclude '**/R.java'
    }
}

// Create tasks to generate javadoc jar
android.libraryVariants.all { variant ->
    task("${variant.name}JavadocJar", type: Jar, dependsOn: "${variant.name}Javadoc") {
        archiveClassifier.set('javadoc')
        from tasks["${variant.name}Javadoc"].destinationDir
    }
}

android.libraryVariants.all { variant ->
    tasks.named("assemble${variant.name.capitalize()}").configure {
        doFirst {
            println("Assembling variant: ${variant.name} for ${project.name}")
        }
    }
}


tasks.register('sourcesJar', Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier.set('sources')
    destinationDirectory = reporting.file("$project.buildDir/outputs/jar/")
}

def configDir = new File(buildscript.sourceFile.parentFile.parentFile, 'config')
ext.checkstyleConfigDir = "$configDir/checkstyle"

checkstyle {
    ignoreFailures = false
    reportsDir = file("$project.buildDir/outputs/")
}

tasks.register('checkstyle', Checkstyle) {
    configFile file("${project.rootDir}/config/checkstyle/checkstyle.xml")

    configProperties.checkstyleConfigDir = checkstyleConfigDir
    configProperties.checkstyleSuppressionsPath = file("${project.rootDir}/config/checkstyle/suppressions.xml").absolutePath
    source 'src'
    include '**/*.java'
    exclude '**/gen/**'
    classpath = files()
}

pmd {
    ignoreFailures = false
    reportsDir = file("$project.buildDir/outputs/")
}

tasks.register('pmd', Pmd) {
    description 'Run pmd'
    group 'verification'

    ruleSets = ["java-basic", "java-braces", "java-strings", "java-unusedcode"]
    source = fileTree('src/main/java')

    reports {
        xml.required = false
        html.required = true
    }
}
// For publishing to the remote maven repo.
afterEvaluate {

    publishing {
        publications {
            distRelease(MavenPublication) {
                from components.distRelease
                groupId 'com.microsoft.identity'
                artifactId 'common'
                //Edit the 'version' here for VSTS RC build
                version = project.version

                pom {
                    name = 'common'
                    description = 'This library contains code shared between the Active Directory ' +
                            'Authentication Library (ADAL) for Android and the Microsoft ' +
                            'Authentication Library (MSAL) for Android. This library ' +
                            'includes only internal classes and is NOT part of the ' +
                            'public API'
                    url = 'https://github.com/AzureAD/microsoft-authentication-library-common-for-android'
                    developers {
                        developer {
                            id = 'microsoft'
                            name = 'Microsoft'
                        }
                    }
                    licenses {
                        license {
                            name = 'MIT License'
                        }
                    }
                    inceptionYear = '2017'
                    scm {
                        url = 'https://github.com/AzureAD/microsoft-authentication-library-common-for-android/tree/master'
                    }
                    properties = [
                            branch : 'master',
                            version: project.version
                    ]
                }
            }
            distDebug(MavenPublication) {
                from components.distDebug
                groupId 'com.microsoft.identity'
                artifactId 'common-debug'
                //Edit the 'version' here for VSTS RC build

                version = project.version
            }
        }

        // Repositories to which Gradle can publish artifacts
        repositories {
            maven {
                name "vsts-maven-adal-android"
                url "https://identitydivision.pkgs.visualstudio.com/_packaging/AndroidADAL/maven/v1"
                credentials {
                    username project.vstsUsername
                    password project.vstsMavenAccessToken
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains("assemble")) {
        task.dependsOn 'pmd'
    }

    if (task.name == 'assembleDebug' || task.name == 'assembleRelease') {
        task.dependsOn 'lint', 'sourcesJar', 'pmd'
    }
    if (task.name == 'assembleDistRelease') {
        task.dependsOn 'sourcesJar'
    }
    // Due to gradle version increase, we need to be more explicit in the dependency chain
    // More information can be found here: https://docs.gradle.org/8.1/userguide/validation_problems.html#implicit_dependency
    if (task.name == "publishDistDebugPublicationToVsts-maven-adal-androidRepository") {
        task.mustRunAfter 'generatePomFileForDistReleasePublication', 'bundleDistReleaseAar'
    }
    if (task.name == "publishDistReleasePublicationToVsts-maven-adal-androidRepository") {
        task.dependsOn 'bundleDistReleaseAar'
    }
    if (task.name == "generateMetadataFileForDistDebugPublication") {
        task.mustRunAfter 'bundleDistDebugAar'
    }
    if (task.name == "generateMetadataFileForDistReleasePublication") {
        task.dependsOn 'bundleDistReleaseAar'
    }
}

// This is used to generate the pom file for publishing to external maven in maven-release-jobs.yml.
// Need to distinguish between distDebug and distRelease for the destination
tasks.withType(GenerateMavenPom).all {
    def functionName = name.toLowerCase()
    if (functionName.contains("distdebug")) {
        destination = layout.buildDirectory.file("poms/common-debug-${project.version}.pom").get().asFile
    } else if (functionName.contains("distrelease")) {
        destination = layout.buildDirectory.file("poms/common-${project.version}.pom").get().asFile
    }
}

// ---------------------------------------------------------------------------
// OWASP Dependency-Check
// ---------------------------------------------------------------------------
// The `org.owasp.dependencycheck` plugin is applied at the top of this file via
// the `plugins { }` DSL (version 12.2.2). It is applied here — rather than only
// in the standalone `common/build.gradle` root — so the `dependencyCheck { }`
// extension is also registered when this module is evaluated from the
// android-complete multi-repo build (whose root build.gradle does not apply
// the plugin via `allprojects { }`).
//
// This block tunes the plugin with Android variant-aware settings for this
// module and wires `dependencyCheckAnalyze` into the standard `check` lifecycle
// so vulnerability scanning runs as part of `./gradlew :common:check` (in the
// android-complete build) or `./gradlew :common:common:check` (standalone).
//
// Override threshold / formats locally via project properties:
//   -PdependencyCheckFailOnCvss=7.0
//   -PdependencyCheckFormats=HTML,JSON,SARIF
def dependencyCheckFailOnCvss = (project.hasProperty("dependencyCheckFailOnCvss")
        ? project.dependencyCheckFailOnCvss
        : "7.0").toFloat()
def dependencyCheckFormats = (project.hasProperty("dependencyCheckFormats")
        ? project.dependencyCheckFormats.toString().split(",").collect { it.trim() }
        : ["HTML", "JSON"])
def dependencyCheckSuppressionFile = file("${projectDir}/../config/owasp/dependency-check-suppressions.xml")

// ---------------------------------------------------------------------------
// NVD API key resolution.
// ---------------------------------------------------------------------------
// Without a key, NVD throttles anonymous calls aggressively and returns HTTP 429
// ("UpdateException: Error updating the NVD Data ... NVD Returned Status Code: 429"),
// which then surfaces as "NoDataException: No documents exist" on the first scan.
//
// The key is owned by the Android Auth team and stored in our team KeyVault.
// It is injected at build time from one of the sources below. There is NO
// hardcoded fallback in this file by design: `common/common/build.gradle` lives
// in the PUBLIC `AzureAD/microsoft-authentication-library-common-for-android`
// repository, and NVD will rotate any key that appears in a public commit.
//
// Resolution order (first non-empty match wins):
//   1. CLI:    ./gradlew ... -PnvdApiKey=<key>
//              CI pipelines pull the key from KeyVault and inject it this way.
//   2. Project / user gradle.properties:  nvdApiKey=<key>
//              (Same lookup as #1 — both resolve via project.findProperty.)
//   3. Env:    NVD_API_KEY=<key>
//
// If the key is missing when `dependencyCheckAnalyze` is in the task graph, the
// build fails fast with an actionable error (see the gradle.taskGraph.whenReady
// block below `tasks.named('check')`) rather than producing a confusing
// 429 / NoDataException stack-trace cascade from inside the plugin.
def __nvdApiKey = (project.findProperty("nvdApiKey")
        ?: System.getenv("NVD_API_KEY"))?.toString()?.trim()

dependencyCheck {
    // Fail the build on HIGH severity (>=7.0) findings by default. CI can relax via -PdependencyCheckFailOnCvss=11.
    failBuildOnCVSS = dependencyCheckFailOnCvss
    formats = dependencyCheckFormats
    outputDirectory = layout.buildDirectory.dir("reports/dependency-check").get().asFile.absolutePath

    // -----------------------------------------------------------------------
    // NVD feed configuration — addresses HTTP 429 / "No documents exist" failures.
    // -----------------------------------------------------------------------
    // Uses flat property assignment (`nvd.apiKey = ...`) rather than the closure form
    // (`nvd { apiKey = ... }`). In dependency-check-gradle 12.x the `nvd(Closure)`
    // configure-method on `DependencyCheckExtension` is @Deprecated; the underlying
    // `NvdExtension` property accessor (`nvd.<prop>`) is still the supported API.
    //
    // The key is only assigned when one was actually supplied (see resolution
    // above). Assigning null / empty would silently regress the scan to anonymous
    // mode and trigger NVD's anonymous throttle (~5 req/30s) on the next run, which
    // surfaces as the 429 / NoDataException cascade we explicitly want to avoid.
    // The fail-fast guard below `tasks.named('check')` ensures the user is told
    // about the missing key before the scan starts.
    if (__nvdApiKey) {
        nvd.apiKey = __nvdApiKey
    }
    // Minimum ms between NVD calls. NVD allows higher throughput with a key
    // (~50 req / 30s) than anonymous (~5 req / 30s), so 2000ms is a safe ceiling
    // that still completes the initial feed pull in a reasonable time.
    nvd.delay = 2000
    // Bound the number of retry attempts so transient NVD outages don't hang CI.
    nvd.maxRetryCount = 10

    // NOTE on NVD feed caching:
    // dependency-check-gradle 12.x does NOT expose a `cveValidForHours` /
    // `cve { validForHours = N }` / equivalent flat property on
    // `DependencyCheckExtension`. Setting either form throws at evaluation:
    //   - "Could not find method cve() for arguments [...]"
    //   - "Could not set unknown property 'cveValidForHours' for extension 'dependencyCheck'"
    // The plugin handles NVD feed caching internally via its embedded H2 database
    // (default location: ~/.gradle/dependency-check-data/). With `nvd.apiKey` set
    // and `nvd.delay = 2000`, the keyed throughput limit (~50 req/30s) is enough
    // to complete the initial feed pull without 429s, and incremental updates on
    // subsequent runs are cheap. No additional caching config is required here.

    // Only scan runtime classpaths actually shipped by this Android library; skip
    // test/androidTest configurations to keep scans fast and signal-to-noise high.
    scanConfigurations = [
            "distReleaseRuntimeClasspath",
            "distDebugRuntimeClasspath",
            "localReleaseRuntimeClasspath",
            "localDebugRuntimeClasspath"
    ]

    // Apply suppression file only if it has been authored; avoids breaking builds on fresh clones.
    if (dependencyCheckSuppressionFile.exists()) {
        suppressionFile = dependencyCheckSuppressionFile.absolutePath
    }

    // -----------------------------------------------------------------------
    // Analyzer toggles — disable analyzers not relevant for an Android/Java library.
    // -----------------------------------------------------------------------
    // Flat property assignment for the same reason as `nvd.*` above: the closure
    // form `analyzers { ... }` is @Deprecated in 12.x. Additionally:
    //   - `nodeEnabled`      -> `nodePackage.enabled`  (replaced by NodePackageExtension)
    //   - `nodeAuditEnabled` -> `nodeAudit.enabled`    (replaced by NodeAuditExtension)
    //   - `nexusEnabled`     -> REMOVED upstream; the Nexus analyzer was deleted from
    //     dependency-check after the legacy Nexus IQ Server API was retired, so the
    //     flag is a no-op and emitting it produces a deprecation warning.
    analyzers.assemblyEnabled = false
    analyzers.nuspecEnabled = false
    analyzers.nodePackage.enabled = false
    analyzers.nodeAudit.enabled = false

    // ArchiveAnalyzer (scans .aar / .zip / .tar.gz for "disguised JARs") is
    // disabled because it crashes with `NoSuchMethodError: ZipFile.builder()` on
    // this build's classpath:
    //   dependency-check 12.x requires commons-compress >= 1.26 (the version that
    //   introduced ZipFile.builder()), but the AGP-heavy buildscript classpath of
    //   `android-complete/build.gradle` pulls in an older commons-compress that
    //   shadows it in the plugin classloader. Forcing commons-compress upstream
    //   risks breaking AGP / other buildscript plugins, so we disable the analyzer
    //   instead. We lose nothing of substance: every dependency is already
    //   identified by its Maven GAV coordinates (handled by JarAnalyzer + the
    //   plugin's dependency-graph analyzer), which is what NVD lookups key off.
    //   "Disguised JAR" detection is only useful for opaque archives, not for
    //   AARs pulled from a Maven repository.
    analyzers.archiveEnabled = false

    // Sonatype OSS Index analyzer requires a token now (Sonatype migrated to the
    // "Sonatype Guide" auth model). We don't have one provisioned and CVE coverage
    // from NVD alone is sufficient for this module's needs. Explicitly disabling
    // suppresses the noisy "OSS Index Analyzer disabled due to missing credentials"
    // log line on every run. See:
    //   https://dependency-check.github.io/DependencyCheck/analyzers/oss-index-analyzer.html
    analyzers.ossIndex.enabled = false
}

// Make `check` (and therefore CI's standard verification step) run the OWASP scan.
tasks.named('check').configure {
    dependsOn 'dependencyCheckAnalyze'
}

// ---------------------------------------------------------------------------
// Fail fast when the NVD API key is missing.
// ---------------------------------------------------------------------------
// Without this guard, a missing key produces the following confusing cascade
// deep inside the plugin:
//   UpdateException: Error updating the NVD Data
//     caused by NvdApiException: NVD Returned Status Code: 429
//   NoDataException: No documents exist
// We check at task-graph-ready time (after configuration but before execution)
// so the error fires only when the user actually intends to run the scan, not
// on every Gradle invocation (e.g. `./gradlew tasks`, IDE sync, etc.).
gradle.taskGraph.whenReady { graph ->
    if (!__nvdApiKey && graph.hasTask(project.tasks.named('dependencyCheckAnalyze').get())) {
        throw new GradleException(
                "OWASP dependency-check requires an NVD API key, but none was provided.\n" +
                "\n" +
                "The key is stored in the Android Auth team KeyVault. Provide it via ONE of:\n" +
                "  1. CLI:                     ./gradlew :common:dependencyCheckAnalyze -PnvdApiKey=<key>\n" +
                "  2. ~/.gradle/gradle.properties:    nvdApiKey=<key>\n" +
                "  3. Environment variable:    NVD_API_KEY=<key>\n" +
                "\n" +
                "CI pipelines should retrieve the key from KeyVault and inject it via -PnvdApiKey.")
    }
}

def dependenciesSizeInMb = project.hasProperty("dependenciesSizeMb") ? project.dependenciesSizeMb : "16"
String configToCheck = project.hasProperty("dependenciesSizeCheckConfig") ? project.dependenciesSizeCheckConfig : "distReleaseRuntimeClasspath"
tasks.register("dependenciesSizeCheck") {
    doLast() {
        def size = configurations.getByName(configToCheck).collect { it.length() / (1024 * 1024) }.sum()
        def formatStr = "%,10.2f"
        def out = new StringBuffer()
        out << 'Total dependencies size:'.padRight(65)
        out << "${String.format(formatStr, size)} Mb\n\n"
        configurations.getByName(configToCheck).sort { -it.length() }
                .each {
                    out << "${it.name}".padRight(65)
                    out << "${String.format(formatStr, (it.length() / 1024))} kb\n"
                }
        println(out)
        if (size > dependenciesSizeInMb.toDouble()) {
            throw new GradleException("Total dependencies size is $size Mb. " +
                    "It should be less than ${dependenciesSizeInMb} Mb")
        }
    }
}
