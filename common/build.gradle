plugins {
    id 'com.microsoft.identity.buildsystem' version '0.2.5'
    id 'com.android.library'
    id 'pmd'
    id 'checkstyle'
    id 'maven-publish'
    id 'kotlin-android'
    id 'jacoco'

    // Test retries
    id 'org.gradle.test-retry' version '1.5.6'
    id 'org.owasp.dependencycheck' version '12.2.2'
}

apply from: '../versioning/version_tasks.gradle'

buildSystem {
    desugar = false
}

def enableCodeCoverage = false

if (project.hasProperty("codeCoverageEnabled")) {
    enableCodeCoverage = codeCoverageEnabled.toBoolean()
}

codeCoverageReport {
    coverage.enabled = enableCodeCoverage
}

jacoco {
    toolVersion = "0.8.10"
}

// https://blog.gradle.org/gradle-flaky-test-retry-plugin
tasks.withType(Test) {
    jacoco {
        includeNoLocationClasses = true // Required for Robolectric
        excludes = ['jdk.internal.*']
    }
    retry {
        // The maximum number of test failures that are allowed before retrying is disabled.
        maxRetries = 2
        // The maximum number of times to retry an individual test.
        maxFailures = 10
        // Controls whether tests that initially fail and then pass on retry should fail the task.
        failOnPassedAfterRetry = false
    }
}

// Registers a JaCoCo XML+HTML coverage report task for a given build variant's unit tests.
// PR validation builds the 'local' flavor, so the PR checks invoke jacocoTestReport
// (localDebug) and its behaviour is unchanged. The weekly release pipeline builds the
// 'dist' flavor and invokes jacocoDistTestReport (distDebug), which reuses the .exec
// produced by distDebug<Module>UnitTestCoverageReport rather than re-running tests on a
// variant the weekly infrastructure doesn't build.
def registerJacocoXmlReport = { String taskName, String variant ->
    def variantCap = variant.capitalize()
    tasks.register(taskName, JacocoReport) {
        dependsOn "test${variantCap}UnitTest" // Run Robolectric tests first

        reports {
            xml.required = true
            html.required = true
        }

        def fileFilter = [
                '**/R.class', '**/R$*.class', '**/BuildConfig.*',
                '**/Manifest*.*', '**/*Test*.*',
                'android/**/*.*', 'com/microsoft/aad/adal/**'
        ]

        def kotlinClasses = fileTree(
                dir: "$buildDir/tmp/kotlin-classes/${variant}",
                excludes: fileFilter
        )

        def javaClasses = fileTree(
                dir: "$buildDir/intermediates/javac/${variant}/compile${variantCap}JavaWithJavac/classes",
                excludes: fileFilter
        )

        sourceDirectories.setFrom(files([
                "$projectDir/src/main/java",
                "$projectDir/src/main/kotlin"
        ]))
        classDirectories.setFrom(files([kotlinClasses, javaClasses]))
        executionData.setFrom(fileTree(
                dir: buildDir,
                includes: [
                        "jacoco/test${variantCap}UnitTest.exec".toString(),
                        "outputs/unit_test_code_coverage/${variant}UnitTest/test${variantCap}UnitTest.exec".toString()
                ]
        ))
    }
}

registerJacocoXmlReport("jacocoTestReport", "localDebug")     // PR validation (local flavor)
registerJacocoXmlReport("jacocoDistTestReport", "distDebug")  // weekly release (dist flavor)

// In dev, we want to keep the dependencies(common4j, broker4j, common) to 1.0.+ to be able to be consumed by daily dev pipeline.
// In release/*, we change these to specific versions being consumed.
def common4jVersion = "1.0.+"
if (project.hasProperty("distCommon4jVersion") && project.distCommon4jVersion != '') {
    common4jVersion = project.distCommon4jVersion
}

boolean newBrokerDiscoveryEnabledFlag = project.hasProperty("newBrokerDiscoveryEnabledFlag")
boolean trustDebugBrokerFlag = project.hasProperty("trustDebugBrokerFlag")
boolean bypassRedirectUriCheck = project.hasProperty("bypassRedirectUriCheck")

def robolectricRepoUsername = System.getenv("ENV_VSTS_MVN_CRED_USERNAME") != null ? System.getenv("ENV_VSTS_MVN_CRED_USERNAME") : project.findProperty("vstsUsername")
def robolectricRepoPassword = System.getenv("ENV_VSTS_MVN_CRED_ACCESSTOKEN") != null ? System.getenv("ENV_VSTS_MVN_CRED_ACCESSTOKEN") : project.findProperty("vstsMavenAccessToken")

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        namespace 'com.microsoft.identity.common'
        multiDexEnabled true
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getAppVersionCode()
        versionName getAppVersionName()
        project.archivesBaseName = "common"
        project.version = android.defaultConfig.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //Languages Common supports.
        resConfigs "en", "ar", "b+sr+Latn", "bg", "ca", "cs", "da", "de", "el", "es", "et",
                "eu", "fi", "fr", "gl", "he", "hi", "hr", "hu", "in", "it", "iw", "ja",
                "kk", "ko", "lt", "lv", "ms", "nb", "nl", "pl", "pt-rBR", "pt-rPT", "ro",
                "ru", "sk", "sl", "sr", "sv", "th", "tr", "uk", "vi", "zh-rCN", "zh-rTW"
        buildConfigField("boolean", "newBrokerDiscoveryEnabledFlag", "$newBrokerDiscoveryEnabledFlag")
        buildConfigField("boolean", "trustDebugBrokerFlag", "$trustDebugBrokerFlag")
        buildConfigField("boolean", "bypassRedirectUriCheck", "$bypassRedirectUriCheck")
    }
    //aidl is being set to true since aidl only generated with this set
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    buildTypes {
        debug {
            testCoverageEnabled enableCodeCoverage
            minifyEnabled false
        }
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-rules.pro'
        }
    }
    //Upgrading to Java 8 in order to use YubiKit SDK
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lintOptions {
        abortOnError true
        disable 'MissingPermission'
        disable 'LongLogTag'
        disable 'DefaultLocale'
        disable 'UnusedResources'
        disable 'GradleDependency'
        disable 'GradleOverrides'
        disable 'OldTargetApi'
        disable 'RtlHardcoded'
    }

    testOptions {
        unitTests.all {
            exclude 'com/microsoft/identity/common/integration'
            exclude 'com/microsoft/identity/common/ropc'
            if (robolectricRepoUsername?.toString()?.trim() && robolectricRepoPassword?.toString()?.trim()) {
                it.systemProperty("robolectric.dependency.repo.url", "https://identitydivision.pkgs.visualstudio.com/_packaging/NewAndroid/maven/v1")
                it.systemProperty("robolectric.dependency.repo.username", robolectricRepoUsername)
                it.systemProperty("robolectric.dependency.repo.password", robolectricRepoPassword)
            }
        }
    }

    flavorDimensions "main"

    productFlavors {
        // The 'local' productFlavor sources common4j from mavenLocal and is intended to be used
        // during development.
        local {
            dimension "main"
        }

        // The 'dist' productFlavor sources common from a central repository and is intended
        // to be used for releases.
        dist {
            dimension "main"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            aidl.srcDirs = ['src/main/aidl']

            // Also load source from common-java
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
        }
    }

    libraryVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${archivesBaseName}-${version}.aar"
        }
    }
}

