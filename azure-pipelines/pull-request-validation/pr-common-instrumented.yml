# File: azure-pipelines\pull-request-validation\pr-common-instrumented.yml
# Description: PR validation that runs Common instrumented (androidTest) tests on an Android emulator.
#              Mirrors the unit-test PR validation (common.yml) but executes
#              common:connectedLocalDebugAndroidTest. Modeled on
#              AuthClientAndroidPipelines/templates/runTests/run-instrumented-tests.yml.
# Wire this pipeline up as a Build Validation branch policy (PR trigger) in ADO.
name: $(date:yyyyMMdd)$(rev:.r)
trigger: none

variables:
# https://developer.android.com/studio/releases/platforms
- name: android.system.image
  value: system-images;android-33;google_apis;x86_64
- name: Codeql.Enabled
  value: false
- group: AndroidAuthClientAutomationSecrets
- group: MSIDLABVARS

resources:
  repositories:
  - repository: common-dev
    type: github
    name: AzureAD/microsoft-authentication-library-common-for-android
    ref: dev
    endpoint: ANDROID_GITHUB

# Instrumented tests need a Linux agent with KVM for the emulator. Microsoft-hosted ubuntu-latest
# ships the Android SDK and supports nested virtualization.
# NOTE: pool image/os sub-properties only take effect when a pipeline extends the 1ES template. A
# standalone PR pipeline must select the OS via vmImage, otherwise a named 1ES pool returns its
# default (Windows) agent and the bash emulator steps fail under cmd.exe.
pool:
  vmImage: ubuntu-latest

stages:
  - stage: instrumented_tests
    displayName: Instrumented Tests
    jobs:
    - job: run_instrumented_tests
      displayName: Run common instrumented tests (LocalDebug)
      timeoutInMinutes: 120
      steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - bash: |
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
        displayName: 'Set VSTS Fields in Environment'
      # The repo's automation-cert.yml installs the pfx into a Windows cert store via
      # Import-PfxCertificate (Windows-only). Instrumented tests run on Linux and only need the
      # pfx file on disk to adb-push it, so we download the secret and write the file directly.
      - task: AzureKeyVault@2
        displayName: 'Azure Key Vault: download LabAuth cert'
        inputs:
          azureSubscription: 'AuthSdkResourceManager'
          KeyVaultName: 'msidlabs'
          SecretsFilter: 'LabAuth'
      - bash: |
          set -e
          echo "$LAB_AUTH_B64" | base64 --decode > "$(Build.SourcesDirectory)/LabAuth.pfx"
          ls -l "$(Build.SourcesDirectory)/LabAuth.pfx"
        displayName: 'Write LabAuth cert to workspace'
        env:
          LAB_AUTH_B64: $(LabAuth)
      - script: echo "##vso[build.addbuildtag]AndroidSystemImage=$(android.system.image)"
        displayName: Tag build with system image
      - bash: |
          set -e
          echo "Preparing Android emulator (system image: $ANDROID_SYSTEM_IMAGE)"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

          # Grant the agent user access to /dev/kvm so the emulator can use hardware acceleration.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          echo "y" | "$SDKMANAGER" --install "$ANDROID_SYSTEM_IMAGE" "platform-tools" "emulator"

          echo "no" | "$AVDMANAGER" create avd -n android_emulator -k "$ANDROID_SYSTEM_IMAGE" --force

          echo "Starting emulator"
          nohup "$ANDROID_HOME/emulator/emulator" -avd android_emulator -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /dev/null 2>&1 &

          echo "Waiting for device to finish booting"
          "$ANDROID_HOME/platform-tools/adb" wait-for-device shell 'while [[ -z $(getprop sys.boot_completed | tr -d "\r") ]]; do sleep 1; done; input keyevent 82'
          "$ANDROID_HOME/platform-tools/adb" devices
          echo "Emulator ready"
        displayName: 'Start Android emulator'
      - bash: |
          echo "Push certificate to emulator"
          "$ANDROID_HOME/platform-tools/adb" push 'LabAuth.pfx' '/data/local/tmp/LabAuth.pfx'
        displayName: 'Push certificate to emulator'
      - bash: |
          mkdir -p $(Build.ArtifactStagingDirectory)/common_logs
          $ANDROID_HOME/platform-tools/adb logcat -c
          $ANDROID_HOME/platform-tools/adb logcat -v threadtime > $(Build.ArtifactStagingDirectory)/common_logs/logcat_logs.txt &
          echo $! > logcat.pid
          echo "Logcat started with PID: $(cat logcat.pid)"
        displayName: 'Start logcat collection'
      - task: Gradle@3
        displayName: Run common instrumented tests
        inputs:
          gradleWrapperFile: 'gradlew'
          javaHomeOption: 'JDKVersion'
          jdkVersionOption: '1.17'
          options: -Psugar=true -PlabSecret=/data/local/tmp/LabAuth.pfx
          tasks: 'common:connectedLocalDebugAndroidTest'
          publishJUnitResults: true
          testResultsFiles: '**/TEST-*.xml'
          testRunTitle: 'common_InstrumentedTests'
      - bash: |
          echo "Stopping logcat (PID: $(cat logcat.pid))"
          kill -9 $(cat logcat.pid) || true
        displayName: 'Stop logcat collection'
        condition: always()
      - task: PublishPipelineArtifact@1
        displayName: 'Publish logcat logs'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/common_logs'
          artifactName: common_logs
      - task: PublishPipelineArtifact@1
        displayName: 'Publish instrumented test HTML report'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(Build.SourcesDirectory)/common/build/reports/androidTests/connected/debug/flavors/local/'
          artifactName: InstrumentedTestReport-common
