# File: azure-pipelines\pull-request-validation\build-consumers.yml
# Description: Test new common in ADAL / MSAL / Broker (assembleLocal and testLocalDebugUnitTest)
# Variable: 'ENV_VSTS_MVN_ANDROIDADACCOUNTS_USERNAME' was defined in the Variables tab
# https://docs.microsoft.com/en-us/azure/devops/organizations/accounts/use-personal-access-tokens-to-authenticate
# Variable: 'commonBranchName' common branch to be used when running the pipeline manually
# Variable: 'skipConsumerValidationLabel' PR label used to skip the checks in this pipeline
name: $(date:yyyyMMdd)$(rev:.r)

trigger: none

pr: 
- dev

parameters:
  - name: shouldSkipLongRunningTest
    displayName: Should skip long running test?
    type: boolean
    default: true

variables:
- name: shouldSkipLongRunningTest
  ${{ if parameters.shouldSkipLongRunningTest }}:
    value: "-PshouldSkipLongRunningTest"
  ${{ else }}:
    value: ""
- name: robolectricSdkVersion
  value: 28
- group: AndroidAuthClientAutomationSecrets
- group: MSIDLABVARS
- group: devex-ciam-test

resources:
  repositories:
  - repository: msal
    type: github
    name: AzureAD/microsoft-authentication-library-for-android
    ref: dev
    endpoint: ANDROID_GITHUB
  - repository: broker
    type: github
    name: AzureAD/ad-accounts-for-android
    ref: dev
    endpoint: ANDROID_GITHUB
  - repository: adal
    type: github
    name: AzureAD/azure-activedirectory-library-for-android
    ref: dev
    endpoint: ANDROID_GITHUB

stages:
- stage: getLabel
  # Check PR Label
  displayName: Check for PR Label
  pool:
    name: Hosted Windows 2019 with VS2019
  jobs:
    - template: ../templates/steps/fetch-pr-labels.yml
- stage: publishCommon
  # Validate Consumers
  displayName: 'Publish common'
  dependsOn: getLabel
  pool:
    name: Hosted Windows 2019 with VS2019
  variables:
    prLabels: $[ stageDependencies.getLabel.getLabelsJob.outputs['fetchPrCILabel.prLabels'] ]
  jobs:
  # setup
  - job: publishcommonlibs
    displayName: Publish common
    condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
    steps:
    - checkout: self
    - template: ../templates/steps/automation-cert.yml
    - task: Gradle@3
      displayName: Assemble common4j
      inputs:
        tasks: common4j:clean common4j:assemble
        publishJUnitResults: false
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
        options: "-PprojVersion=0.0.$(build.buildid)"
    - task: Gradle@3
      displayName: Publish common4j
      inputs:
        tasks: common4j:publish
        publishJUnitResults: false
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
        options: "-PprojVersion=0.0.$(build.buildid)"
    - task: Gradle@3
      displayName: Assemble common
      inputs:
        tasks: common:clean common:assembleDist
        publishJUnitResults: false
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
        options: "PdistCommon4jVersion=0.0.$(build.buildid) -PprojVersion=0.0.$(build.buildid)"
    - task: Gradle@3
      displayName: Publish common
      inputs:
        tasks: common:publish -PprojVersion=0.0.$(build.buildid)
        publishJUnitResults: false
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
        options: "-PprojVersion=0.0.$(build.buildid)"
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Param (
              [Parameter(Mandatory = $true)][String]$PackagingPAT,
              [Parameter(Mandatory = $false)][String]$common4jVersion,
              [Parameter(Mandatory = $false)][String]$commonVersion,
              [Parameter(Mandatory = $false)][String]$PromoteToView = "Prerelease",
              [Parameter(Mandatory = $false)][String]$Organization = "identitydivision",
              [Parameter(Mandatory = $false)][String]$FeedName="AndroidADAL"
          )

          #request uri
          $baseUri = "https://pkgs.dev.azure.com/$Organization";
          $promotePackagesApi = "_apis/packaging/feeds/$FeedName/maven/packagesbatch?api-version=7.1-preview.1"
          $promotePackagesUri = "$baseUri/$promotePackagesApi"

          # Auth header
          $base64AuthInfo = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(("token:{0}" -f $PackagingPAT)))
          $authHeader = @{Authorization = ("Basic {0}" -f $base64AuthInfo)};


          # Request Body
          $MavenPackagesBatchRequest = New-Object PSObject -Property @{
                  data = @{ viewId = $PromoteToView }
                  operation = "promote"
                  packages = @(
                      @{ artifact = "common4j"; group = "com.microsoft.identity"; version = $common4jVersion},
                      @{ artifact = "common"; group = "com.microsoft.identity"; version = $commonVersion}
                  )
          }

          $requestBody = $MavenPackagesBatchRequest | ConvertTo-Json

          # Call ADO Rest API
          try {
              $Result = Invoke-RestMethod -Uri $promotePackagesUri -Method Post -ContentType "application/json" -Headers $authHeader -Body $requestBody;
          } catch {
              if($_.ErrorDetails.Message){
                  Write-Error $_.ErrorDetails.Message
              }
              throw $_.Exception
          }
        arguments:
          -PackagingPAT "$(System.AccessToken)"
          -common4jVersion "0.0.$(build.buildid)"
          -commonVersion "0.0.$(build.buildid)"

- stage: validateMSAL
  displayName: 'Validate MSAL'
  dependsOn: publishCommon
  jobs:
  - job: msalValidation
    displayName: MSAL
    steps:
    - checkout: msal
      displayName: Checkout msal repository
      clean: true
      submodules: recursive
      persistCredentials: True
    - task: Gradle@3
      displayName: Assemble msal
      inputs:
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
        tasks: clean msal:assembleDist
    - bash: |
        echo "##vso[task.setvariable variable=ENV_VSTS_MVN_ANDROIDCOMMON_USERNAME]VSTS"
        echo "##vso[task.setvariable variable=ENV_VSTS_MVN_ANDROIDCOMMON_ACCESSTOKEN]$(System.AccessToken)"
      displayName: 'Set Environmnet variables'
    - task: Gradle@3
      displayName: Run msal Unit tests
      inputs:
        tasks: msal:testLocalDebugUnitTest -Plabtest -PlabSecret=$(LabVaultAppCert) -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PmockApiUrl=$(MOCK_API_URL)
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
  # broker
  - job: brokerValidation
    displayName: Broker
    cancelTimeoutInMinutes: 1
    timeoutInMinutes: 120
    variables:
      commonBranch: $[ dependencies.publishcommon.outputs['setvarStep.commonBranch'] ]  # map in the variable
    condition: false
    pool:
      name: 1ES-AndroidPool-EOC
    steps:
    - checkout: broker
      displayName: Checkout broker repository
      clean: true
      submodules: recursive
      persistCredentials: True
    - template: ../templates/steps/automation-cert.yml
    - task: CmdLine@2
      displayName: Checkout common submodule $(commonBranch)
      inputs:
        script: |
          git fetch
          git checkout $(commonBranch)
          git pull
          git status
          git rev-parse HEAD
        workingDirectory: $(Agent.BuildDirectory)/s/common
    - task: Gradle@3
      displayName: Assemble broker
      inputs:
        tasks: AADAuthenticator:clean AADAuthenticator:assembleLocal --build-cache --info
        publishJUnitResults: false
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
    - task: Gradle@3
      displayName: Run broker Unit tests
      inputs:
        tasks: AADAuthenticator:localDebugAADAuthenticatorUnitTestCoverageReport --build-cache --info -Plabtest -PlabSecret=$(LabVaultAppCert) -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PpowerLiftApiKey=$(powerliftApiKey) -PcodeCoverageEnabled=true ${{variables.shouldSkipLongRunningTest}}
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
  # Linux broker
  - job: linuxBrokerValidation
    displayName: Linux Broker
    condition: false
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: broker
        displayName: Checkout broker repository
        clean: true
        submodules: recursive
        persistCredentials: True
      - task: CmdLine@1
        displayName: Set MVN Access Token in Environment
        inputs:
          filename: echo
          arguments: '##vso[task.setvariable variable=ENV_VSTS_MVN_ANDROIDADACCOUNTS_ACCESSTOKEN]$(System.AccessToken)'
      - task: CmdLine@1
        displayName: Set Office MVN Access Token in Environment
        inputs:
          filename: echo
          arguments: '##vso[task.setvariable variable=ENV_VSTS_MVN_OFFICE_ACCESSTOKEN]$(System.AccessToken)'
      - task: Gradle@3
        name: Gradle3
        displayName: Assemble Linux Broker
        inputs:
          cwd: $(Build.SourcesDirectory)/broker-java-root
          tasks: LinuxBroker:clean LinuxBroker:assemble --build-cache --info
          publishJUnitResults: false
          jdkArchitecture: x64
          jdkVersionOption: "1.11"
      - task: Bash@3
        retryCountOnTaskFailure: 3
        displayName: Execute tests
        inputs:
          workingDirectory: $(Build.SourcesDirectory)/broker-java-root
          targetType: 'inline'
          script: |
            sudo apt-get install -y dbus-x11
            sudo apt-get install -y dos2unix
            dos2unix gradlew
            chmod +x gradlew
            export DISPLAY=:0.0
            eval $(dbus-launch --sh-syntax)
            sudo apt install gnome-keyring
            /usr/bin/gnome-keyring-daemon --start --components=secrets
            ./gradlew LinuxBroker:linuxBrokerUnitTestCoverageReport -Plabtest -PlabSecret=$(LabVaultAppCert) -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PcodeCoverageEnabled=true -Psystemd_mode_enabled=false
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '**/TEST-*.xml'
          searchFolder: 'LinuxBroker'
  # adal
  - job: adalValidation
    displayName: ADAL
    condition: false
    steps:
    - checkout: adal
      displayName: Checkout adal repository
      clean: true
      submodules: recursive
      persistCredentials: True
    - task: CmdLine@2
      displayName: Checkout common submodule $(commonBranch)
      inputs:
        script: |
          git fetch
          git checkout $(commonBranch)
          git pull
          git status
          git rev-parse HEAD
        workingDirectory: $(Agent.BuildDirectory)/s/common
    - template: ../templates/steps/automation-cert.yml
    - task: Gradle@3
      displayName: Assemble adal
      inputs:
        tasks: clean adal:assembleLocal
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
    - task: Gradle@3
      displayName: Run adal Unit tests
      inputs:
        tasks: adal:testLocalDebugUnitTest -Plabtest -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PlabSecret=$(LabVaultAppCert)
        jdkArchitecture: x64
        jdkVersionOption: "1.11"
