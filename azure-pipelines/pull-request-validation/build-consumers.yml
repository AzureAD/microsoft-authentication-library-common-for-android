# File: azure-pipelines\pull-request-validation\build-consumers.yml
# Description: Test new common in ADAL / MSAL / Broker (assembleLocal and testLocalDebugUnitTest)
# Variable: 'ENV_VSTS_MVN_ANDROIDADACCOUNTS_USERNAME' was defined in the Variables tab
# https://docs.microsoft.com/en-us/azure/devops/organizations/accounts/use-personal-access-tokens-to-authenticate
# Variable: 'commonBranchName' common branch to be used when running the pipeline manually
# Variable: 'skipConsumerValidationLabel' PR label used to skip the checks in this pipeline
name: $(date:yyyyMMdd)$(rev:.r)

parameters:
  - name: shouldSkipLongRunningTest
    displayName: Should skip long running test?
    type: boolean
    default: true

variables:
- name: shouldSkipLongRunningTest
  ${{ if parameters.shouldSkipLongRunningTest }}:
    value: "-PshouldSkipLongRunningTest"
  ${{ else }}:
    value: ""
- name: robolectricSdkVersion
  value: 28
- name: projVersion
  value: "0.0.0$(Build.BuildId)"
- group: AndroidAuthClientAutomationSecrets
- group: MSIDLABVARS
- group: devex-ciam-test

resources:
  repositories:
  - repository: msal
    type: github
    name: AzureAD/microsoft-authentication-library-for-android
    ref: dev
    endpoint: ANDROID_GITHUB
  - repository: broker
    type: github
    name: AzureAD/ad-accounts-for-android
    ref: dev
    endpoint: ANDROID_GITHUB
  - repository: adal
    type: github
    name: AzureAD/azure-activedirectory-library-for-android
    ref: dev
    endpoint: ANDROID_GITHUB
  - repository: AuthClientAndroidPipelines
    type: git
    name: AuthClientAndroidPipelines
    ref: refs/heads/main


################################################  Main  ################################################
extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: MSSecurity-1ES-Build-Agents-Pool
      image: MSSecurity-1ES-Ubuntu-2204
      os: linux
    sdl:
      sourceAnalysisPool:
        name: MSSecurity-1ES-Build-Agents-Pool
        image: MSSecurity-1ES-Windows-2022
        os: windows
      sourceRepositoriesToScan:
        include:
          - repository: broker
          - repository: msal
          - repository: adal
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/config/credscan/suppression.json
      spotBugs:
        enabled: false
      policheck:
        enabled: false

    stages:
    - stage: getLabel
      # Check PR Label
      displayName: Check for PR Label
      pool:
        vmImage: 'windows-2022'
      jobs:
        - template: ../templates/steps/fetch-pr-labels.yml
    - stage: validateConsumers
      # Validate Consumers
      displayName: 'Validate'
      dependsOn: getLabel
      pool:
        vmImage: 'windows-2022'
      variables:
        prLabels: $[ stageDependencies.getLabel.getLabelsJob.outputs['fetchPrCILabel.prLabels'] ]
        commonBranch: $[ stageDependencies.validateConsumers.setupBranch.outputs['setvarStep.commonBranch'] ]  # Centralized common branch variable
      jobs:
      # setup
      - job: setupBranch
        displayName: Setup branch
        condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
        steps:
        - checkout: none
        - task: PowerShell@2
          name: setvarStep
          displayName: Set var branch
          inputs:
            targetType: inline
            script: |
              $branch = switch ( '$(Build.Reason)' )
              {
                  PullRequest
                  {
                    '$(System.PullRequest.SourceBranch)'
                  }
                  Manual
                  {
                    '$(commonBranchName)'
                  }
                  default
                  {
                    ''
                  }
              }
              Write-Output "$branch"
              echo "##vso[task.setvariable variable=commonBranch;isOutput=true]$branch"
        - powershell: |
            if ("$(setvarStep.commonBranch)" -eq "") {
              Write-Output "commonBranchName is not set using default common"
            }
            else{
              Write-Output "Using common branch $(setvarStep.commonBranch) in consumers"
            }
          name: echovar
          displayName: Echo branch name

      - job: publishCommon
        displayName: Publish Common
        dependsOn:
          - setupBranch
        condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
        steps:
          - checkout: self
            displayName: Checkout common repository
            clean: true
            persistCredentials: True
          - bash: |
              echo "##vso[task.setvariable variable=ENV_VSTS_MVN_ANDROIDCOMMON_USERNAME]VSTS"
              echo "##vso[task.setvariable variable=ENV_VSTS_MVN_ANDROIDCOMMON_ACCESSTOKEN]$(System.AccessToken)"
            displayName: 'Set Environmnet variables'
          - task: Gradle@3
            displayName: Assemble Common 4j
            inputs:
              tasks: common4j:assemble  -PprojVersion=$(projVersion)
              jdkArchitecture: x64
              jdkVersionOption: "1.17"
          - task: Gradle@3
            displayName: Publish Common 4j
            inputs:
              tasks: common4j:publish  -PprojVersion=$(projVersion)
              jdkArchitecture: x64
              jdkVersionOption: "1.17"
          - task: Gradle@3
            displayName: Assemble Common
            inputs:
              tasks: common:assembleDis  -PprojVersion=$(projVersion) -PdistCommon4jVersion=$(projVersion)
              jdkArchitecture: x64
              jdkVersionOption: "1.17"
          - task: Gradle@3
            displayName: Publish Common
            inputs:
              tasks: common:publish  -PprojVersion=$(projVersion) -PdistCommon4jVersion=$(projVersion)
              jdkArchitecture: x64
              jdkVersionOption: "1.17"

      - template: templates/build/testApps/build-one-auth-test-app.yml@AuthClientAndroidPipelines
        parameters:
          commonVersion: $(projVersion)
          branch: android/common-ingestion

        # msal
      - job: msalValidation
        displayName: MSAL
        dependsOn:
          - setupBranch
        condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
        steps:
        - checkout: msal
          displayName: Checkout msal repository
          clean: true
          submodules: recursive
          persistCredentials: True
        - task: CmdLine@2
          displayName: Checkout common submodule $(commonBranch)
          inputs:
            script: |
              git fetch
              git checkout $(commonBranch)
              git pull
              git status
              git rev-parse HEAD
            workingDirectory: $(Agent.BuildDirectory)/s/common
        - task: Gradle@3
          displayName: Assemble msal
          inputs:
            jdkArchitecture: x64
            jdkVersionOption: "1.17"
            tasks: clean msal:assembleLocal
        - template: ../templates/steps/automation-cert.yml
        - task: Gradle@3
          displayName: Run msal Unit tests
          inputs:
            tasks: msal:testLocalDebugUnitTest -Plabtest -PlabSecret=$(LabVaultAppCert) -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PmockApiUrl=$(MOCK_API_URL) -PnativeAuthConfigString=$(NATIVE_AUTH_CONFIG_STRING)
            jdkArchitecture: x64
            jdkVersionOption: "1.17"
      # broker
      - job: brokerValidation
        displayName: Broker
        cancelTimeoutInMinutes: 1
        timeoutInMinutes: 120
        dependsOn:
          - setupBranch
        condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
        pool:
          name: MSSecurity-1ES-Build-Agents-Pool
          image: MSSecurity-1ES-Windows-2022
          os: windows
        steps:
        - checkout: broker
          displayName: Checkout broker repository
          clean: true
          submodules: recursive
          persistCredentials: True
        - template: ../templates/steps/automation-cert.yml
        - task: CmdLine@2
          displayName: Checkout common submodule $(commonBranch)
          inputs:
            script: |
              git fetch
              git checkout $(commonBranch)
              git pull
              git status
              git rev-parse HEAD
            workingDirectory: $(Agent.BuildDirectory)/s/common
        - task: Gradle@3
          displayName: Assemble broker
          inputs:
            tasks: AADAuthenticator:clean AADAuthenticator:assembleLocal --build-cache --info
            publishJUnitResults: false
            jdkArchitecture: x64
            jdkVersionOption: "1.17"
        - task: Gradle@3
          displayName: Run broker Unit tests
          inputs:
            tasks: AADAuthenticator:localDebugAADAuthenticatorUnitTestCoverageReport --build-cache --info -Plabtest -PlabSecret=$(LabVaultAppCert) -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PpowerLiftApiKey=$(powerliftApiKey) -PcodeCoverageEnabled=true ${{variables.shouldSkipLongRunningTest}}
            jdkArchitecture: x64
            jdkVersionOption: "1.17"
      # Linux broker
      - job: linuxBrokerValidation
        displayName: Linux Broker
        dependsOn:
          - setupBranch
        condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
        pool:
          vmImage: 'ubuntu-22.04'
        steps:
          - checkout: broker
            displayName: Checkout broker repository
            clean: true
            submodules: recursive
            persistCredentials: True
          - task: AzureKeyVault@2
            displayName: 'Get Key vault LabAuth'
            inputs:
              azureSubscription: 'AuthSdkResourceManager'
              KeyVaultName: 'MSIDLABS'
              SecretsFilter: 'LabAuth'
          - bash: lsb_release -d
            displayName: ubuntu version
          - task: PowerShell@2
            displayName: Java Version
            inputs:
              targetType: inline
              script: java -version
          - task: CmdLine@1
            displayName: Set MVN Access Token in Environment
            inputs:
              filename: echo
              arguments: '##vso[task.setvariable variable=ENV_VSTS_MVN_ANDROIDADACCOUNTS_ACCESSTOKEN]$(System.AccessToken)'
          - task: CmdLine@1
            displayName: Set Office MVN Access Token in Environment
            inputs:
              filename: echo
              arguments: '##vso[task.setvariable variable=ENV_VSTS_MVN_OFFICE_ACCESSTOKEN]$(System.AccessToken)'
          - task: Gradle@3
            name: Gradle3
            displayName: Assemble Linux Broker
            inputs:
              cwd: $(Build.SourcesDirectory)/broker-java-root
              tasks: LinuxBroker:clean LinuxBroker:assemble --build-cache --info
              publishJUnitResults: false
              jdkArchitecture: x64
              jdkVersionOption: "1.17"
          - task: Bash@3
            displayName: Execute tests
            inputs:
              workingDirectory: $(Build.SourcesDirectory)/broker-java-root
              targetType: 'inline'
              script: |
                # Set Java 17
                tree /usr/lib/jvm
                echo "Current Java Home: $JAVA_HOME"
                export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
                export PATH=$JAVA_HOME/bin:$PATH
                echo "New Java Home: $JAVA_HOME"
                java -version  # Verify Java 17 is being used
                
                sudo apt-get install -y dbus-x11
                sudo apt-get install -y dos2unix
                dos2unix gradlew
                chmod +x gradlew
                export DISPLAY=:0.0
                eval $(dbus-launch --sh-syntax)
                sudo apt install gnome-keyring
                /usr/bin/gnome-keyring-daemon --start --components=secrets
                
                ./gradlew LinuxBroker:linuxBrokerUnitTestCoverageReport -PcodeCoverageEnabled=true -PlabSecret=$(LabAuth) -Psystemd_mode_enabled=false --build-cache --info
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/TEST-*.xml'
              searchFolder: 'LinuxBroker'
      # adal
      - job: adalValidation
        displayName: ADAL
        dependsOn:
          - setupBranch
        condition: and( succeeded(), not(contains(variables['prLabels'], variables['skipConsumerValidationLabel'])) )
        steps:
        - checkout: adal
          displayName: Checkout adal repository
          clean: true
          submodules: recursive
          persistCredentials: True
        - task: CmdLine@2
          displayName: Checkout common submodule $(commonBranch)
          inputs:
            script: |
              git fetch
              git checkout $(commonBranch)
              git pull
              git status
              git rev-parse HEAD
            workingDirectory: $(Agent.BuildDirectory)/s/common
        - template: ../templates/steps/automation-cert.yml
        - task: Gradle@3
          displayName: Assemble adal
          inputs:
            tasks: clean adal:assembleLocal
            jdkArchitecture: x64
            jdkVersionOption: "1.17"
        - task: Gradle@3
          displayName: Run adal Unit tests
          inputs:
            tasks: adal:testLocalDebugUnitTest -Plabtest -ProbolectricSdkVersion=${{variables.robolectricSdkVersion}} -PlabSecret=$(LabVaultAppCert)
            jdkArchitecture: x64
            jdkVersionOption: "1.17"
