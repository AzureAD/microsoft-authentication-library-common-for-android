# File: azure-pipelines\pull-request-validation\common.yml
# Variable: 'MOCK_API_URL' was defined in the Variables tab
# Variable: 'NATIVE_AUTH_CONFIG_STRING' was defined in the Variables tab
# Description: Assemble and run unit test
name: $(date:yyyyMMdd)$(rev:.r)
trigger: none
variables:
  - group: devex-ciam-test

resources:
  repositories:
  - repository: common-dev
    type: github
    name: AzureAD/microsoft-authentication-library-common-for-android
    ref: dev
    endpoint: ANDROID_GITHUB

pool:
  vmImage: 'windows-2022'

stages:
  - stage: build_and_test
    displayName: Build and Test
    jobs:
    - job: build_test
      displayName: PR Branch Testing
      cancelTimeoutInMinutes: 1
      variables:
        Codeql.Enabled: true
      steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - template: ../templates/steps/automation-cert.yml
      - bash: |
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
        displayName: 'Set VSTS Fields in Environment'
      - task: CodeQL3000Init@0
      - task: Gradle@3
        name: Gradle3
        displayName: Assemble Local
        inputs:
          javaHomeSelection: JDKVersion
          jdkVersionOption: "1.17"
          tasks: clean common:assembleLocal
          publishJUnitResults: false
          jdkArchitecture: x64
          sqAnalysisEnabled: false
      - task: CodeQL3000Finalize@0
      - task: Gradle@2
        displayName: Run Unit tests
        inputs:
          javaHomeSelection: JDKVersion
          jdkVersionOption: "1.17"
          tasks: common:jacocoTestReport -PlabSecret=$(LabVaultAppCert) -PmockApiUrl=$(MOCK_API_URL) -PnativeAuthConfigString=$(NATIVE_AUTH_CONFIG_STRING)
      - task: Gradle@3
        displayName: Check Dependencies size
        condition: eq(variables['system.pullRequest.targetBranch'], 'dev')
        inputs:
          tasks: common:dependenciesSizeCheck -PdependenciesSizeCheckConfig=distReleaseRuntimeClasspath
          jdkVersionOption: "1.17"
      - script: tree "$(Build.SourcesDirectory)" /F /A
        displayName: 'Print File Structure Tree'
      - publish: $(Build.SourcesDirectory)/common/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        artifact: jacocoReport
        displayName: 'Publish JaCoCo Report Artifact (PR Branch)'
      - task: PublishCodeCoverageResults@1
        displayName: Publish Code Coverage Results
        condition: always()
        inputs:
          codeCoverageTool: 'JaCoCo'
          summaryFileLocation: '$(Build.SourcesDirectory)/common/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml'
          reportDirectory: '$(Build.SourcesDirectory)/common/build/reports/jacoco/jacocoTestReport/html'
          failIfCoverageEmpty: false

    - job: build_test_dev
      displayName: Dev Branch Testing
      cancelTimeoutInMinutes: 1
      variables:
        Codeql.Enabled: true
      steps:
        - checkout: common-dev
          clean: true
          submodules: recursive
          persistCredentials: True
        - template: ../templates/steps/automation-cert.yml
        - bash: |
            echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
            echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
          displayName: 'Set VSTS Fields in Environment'
        - task: CodeQL3000Init@0
        - task: Gradle@3
          name: Gradle3
          displayName: Assemble Local
          inputs:
            javaHomeSelection: JDKVersion
            jdkVersionOption: "1.17"
            tasks: clean common:assembleLocal
            publishJUnitResults: false
            jdkArchitecture: x64
            sqAnalysisEnabled: false
        - task: CodeQL3000Finalize@0
        - task: Gradle@2
          displayName: Run Unit tests
          inputs:
            javaHomeSelection: JDKVersion
            jdkVersionOption: "1.17"
            tasks: common:jacocoTestReport -PlabSecret=$(LabVaultAppCert) -PmockApiUrl=$(MOCK_API_URL) -PnativeAuthConfigString=$(NATIVE_AUTH_CONFIG_STRING)
        - task: Gradle@3
          displayName: Check Dependencies size
          condition: eq(variables['system.pullRequest.targetBranch'], 'dev')
          inputs:
            tasks: common:dependenciesSizeCheck -PdependenciesSizeCheckConfig=distReleaseRuntimeClasspath
            jdkVersionOption: "1.17"
        - script: tree "$(Build.SourcesDirectory)" /F /A
          displayName: 'Print File Structure Tree'
        - publish: $(Build.SourcesDirectory)/common/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          artifact: jacocoReportDev
          displayName: 'Publish JaCoCo Report Artifact (Dev Branch)'

    - job: spotbugs
      displayName: SpotBugs (PR)
      cancelTimeoutInMinutes: 1
      steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - template: ../templates/steps/spotbugs.yml
        parameters:
          project: common

    - job: lint
      displayName: Lint (PR)
      cancelTimeoutInMinutes: 1
      steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - bash: |
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
        displayName: 'Set VSTS Fields in Environment'
      - task: Gradle@3
        displayName: Lint
        inputs:
          tasks: clean common:lintLocalDebug
          publishJUnitResults: false
          javaHomeSelection: JDKVersion
          jdkVersionOption: "1.17"

    - job: dependency_check
      displayName: OWASP Dependency Check (PR)
      cancelTimeoutInMinutes: 1
      # AndroidAuthClientAutomationSecrets is linked to the team KeyVault and
      # exposes NVD-API-Key (owned by the Android Auth team). Required by the
      # dependencyCheck { nvd.apiKey = ... } block in common/common/build.gradle
      # — without it the NVD feed throttles anonymous calls (HTTP 429) and the
      # plugin fails fast via the gradle.taskGraph.whenReady guard.
      variables:
        - group: AndroidAuthClientAutomationSecrets
      steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - bash: |
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
        displayName: 'Set VSTS Fields in Environment'
      # Pre-flight sanity check: surfaces a missing / empty NVD_API_KEY in one log line
      # instead of buried inside an NVD "UpdateException" stack-trace 60 seconds later.
      # We print ONLY the length, never the value, so the secret is never echoed even
      # under `set -x` or verbose pipeline diagnostics.
      - pwsh: |
          $key = $env:NVD_API_KEY
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Host "##vso[task.logissue type=error]NVD_API_KEY env var is empty. Check that AndroidAuthClientAutomationSecrets is linked and NVD-API-Key is populated in KeyVault."
            exit 1
          }
          Write-Host "NVD_API_KEY is set (length=$($key.Length))."
        displayName: 'Validate NVD_API_KEY is populated'
        env:
          NVD_API_KEY: $(NVD-API-Key)
      # Cache the dependency-check H2 database across pipeline runs.
      # ---------------------------------------------------------------------------
      # The plugin stores its NVD feed mirror at ~/.gradle/dependency-check-data/.
      # Without caching, every PR run pulls the full NVD feed (~25 years of CVEs)
      # from services.nvd.nist.gov, which is the single biggest cause of the
      # `UpdateException: Error updating the NVD Data` failures we've seen — NVD
      # has frequent transient 503s and even with an API key the cold pull can
      # race the agent's network timeout.
      #
      # With this cache:
      #   - First run on a new key seeds the DB (one-time slow path).
      #   - Subsequent runs only fetch incremental updates (cheap, ~seconds).
      #   - The cache key is bumped by changing the version suffix below if we
      #     ever need to force a rebuild (e.g. plugin major version upgrade).
      - task: Cache@2
        displayName: 'Cache OWASP dependency-check NVD DB'
        inputs:
          key: 'owasp-dependency-check-nvd | "v1" | "windows-2022"'
          path: $(USERPROFILE)/.gradle/dependency-check-data
      - task: Gradle@3
        displayName: Run OWASP Dependency Check
        # Scan configuration:
        #   -PdependencyCheckFormats    Generate HTML (human review), JSON (tooling), and
        #                               SARIF (security dashboards / GitHub code scanning /
        #                               Defender for DevOps ingestion).
        #   -PdependencyCheckFailOnCvss=11   CVSS scores cap at 10.0, so a threshold of 11
        #                               disables the build-fail behavior. PR validation
        #                               reports findings as warnings + an artifact instead
        #                               of blocking the PR; ownership / SLA enforcement
        #                               happens via the published SARIF in security tooling.
        #   --stacktrace --info         Surface the `Caused by` clause when the NVD update
        #                               step throws `UpdateException: Error updating the
        #                               NVD Data` — without it the root cause (403 invalid
        #                               key / 429 throttled / 503 outage / proxy block /
        #                               JSON parse error) is hidden and the failure is
        #                               undiagnosable from the pipeline log alone.
        #
        # NVD API key is passed via the NVD_API_KEY environment variable rather than as a
        # `-PnvdApiKey="$(NVD-API-Key)"` argument. Reasons:
        #   1. Windows-agent shell quoting: Gradle@3 spawns gradle through cmd.exe; a
        #      secret containing &, =, ^ or other shell-special chars can be mangled when
        #      ADO macro-substitutes it into the `tasks:` string, producing an empty key
        #      and the "UpdateException: Error updating the NVD Data" failure cascade.
        #   2. SDL hygiene: secrets on a command line can leak into process listings,
        #      crash dumps, and verbose Gradle logs. Env vars stay scoped to the process.
        # `common/common/build.gradle` already reads `System.getenv("NVD_API_KEY")` as
        # resolution-order #3 in its NVD key block, so no build-script change is needed.
        #
        # Resilience knobs:
        #   continueOnError: true            Vulnerability findings (or scan-engine
        #                                    errors like a transient NVD 503) never
        #                                    block the PR — the job is marked
        #                                    "succeeded with issues" and reviewers
        #                                    consume findings via the published
        #                                    SARIF / HTML artifacts.
        #   retryCountOnTaskFailure: 1       NVD 5xx/429 hiccups are common; one
        #                                    automatic retry catches the majority
        #                                    without us having to re-run the PR.
        continueOnError: true
        retryCountOnTaskFailure: 1
        env:
          # ADO secret variables are NOT auto-mapped into env; explicit mapping is required.
          # The hyphenated source name (NVD-API-Key) can't be used directly as an env var,
          # so we re-map it to the underscored name the build script expects.
          NVD_API_KEY: $(NVD-API-Key)
        inputs:
          tasks: >-
            common:dependencyCheckAnalyze
            -PdependencyCheckFormats=HTML,JSON,SARIF
            -PdependencyCheckFailOnCvss=11
            --stacktrace
            --info
          publishJUnitResults: false
          javaHomeSelection: JDKVersion
          jdkVersionOption: "1.17"
      # Publish the full report directory (HTML for humans, JSON for tooling, SARIF for
      # security dashboards). `always()` so the artifact is available even if the scan
      # surfaced warnings or the step soft-failed via continueOnError.
      - publish: $(Build.SourcesDirectory)/common/build/reports/dependency-check
        artifact: dependencyCheckReport
        displayName: 'Publish OWASP Dependency Check Report'
        condition: always()
      # Publish the SARIF separately so downstream stages / pipelines (e.g. GitHub
      # Advanced Security upload, Defender for DevOps, custom triage automation) can
      # consume it without pulling the entire report bundle.
      - publish: $(Build.SourcesDirectory)/common/build/reports/dependency-check/dependency-check-report.sarif
        artifact: dependencyCheckSarif
        displayName: 'Publish OWASP Dependency Check SARIF'
        condition: always()

  - template: ../code-coverage/compare-code-coverage.yml
    parameters:
      commonRepoAlias: self
      dependsOn:
        - build_and_test
...
