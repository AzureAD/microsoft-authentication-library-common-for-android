# File: azure-pipelines\pull-request-validation\lab-utilities.yml
# Description: Run test in LabApiUtilities
name: $(date:yyyyMMdd)$(rev:.r)

trigger: none

resources:
  repositories:
    - repository: self
      type: git
      ref: dev

pool:
  vmImage: 'windows-2022'

variables:
  - group: MSIDLABVARS

jobs:
  - job: Phase_1
    displayName: Phase 1
    steps:
      - checkout: self
        clean: true
        submodules: recursive
        persistCredentials: True
      - bash: |
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_USERNAME]VSTS"
          echo "##vso[task.setvariable variable=ENV_VSTS_MVN_CRED_ACCESSTOKEN]$(System.AccessToken)"
        displayName: 'Set VSTS Fields in Environment'
      - template: ../templates/steps/automation-cert.yml
      - task: Gradle@1
        name: Gradle1
        displayName: Assembles the outputs of this project.
        inputs:
          cwd: $(Build.SourcesDirectory)/common-java-root
          tasks: LabApiUtilities:clean LabApiUtilities:assemble
          javaHomeSelection: JDKVersion
          jdkVersionOption: "1.17"
      - template: ../templates/steps/spotbugs.yml
        parameters:
          project: LabApiUtilities
          cwd: $(Build.SourcesDirectory)/common-java-root
          spotbugsCommand: spotbugsMain
      - task: Gradle@2
        displayName: Run the unit tests.
        inputs:
          cwd: $(Build.SourcesDirectory)/common-java-root
          tasks: LabApiUtilities:test -Psugar=true -PlabSecret=$(LabVaultAppCert)
          javaHomeSelection: JDKVersion
          jdkVersionOption: "1.17"
...
